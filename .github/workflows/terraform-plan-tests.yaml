name: Terraform Plan Tests
on:
  pull_request: { types: [opened, reopened, synchronize], branches: [main] }
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pull-requests: write }
jobs:
  terraform-plan-tests:
    name: Terraform Plan Tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [stateful, stateless]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - working-directory: ${{ matrix.module }}
        run: terraform init -backend=false
      - working-directory: ${{ matrix.module }}
        run: terraform test -test-directory=tests/plan
